name: Plugin Check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: JS syntax, sandbox smoke test & index.json check
        run: |
          for f in *.js; do node --check "$f" || exit 1; done
          node smoke-test.mjs
          python3 gen-index.py
          git diff --exit-code index.json
